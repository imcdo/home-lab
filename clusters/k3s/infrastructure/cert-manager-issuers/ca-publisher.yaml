apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-publisher-caddy
  namespace: cert-manager
data:
  Caddyfile: |
    :80 {
      root * /srv
      file_server browse
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-publisher
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ca-publisher
  template:
    metadata:
      labels:
        app: ca-publisher
    spec:
      containers:
        - name: caddy
          image: caddy:2.9.1-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: ca-cert
              mountPath: /srv/home-lan-root-ca.crt
              subPath: tls.crt
              readOnly: true
      volumes:
        - name: caddyfile
          configMap:
            name: ca-publisher-caddy
        - name: ca-cert
          secret:
            secretName: home-lan-root-ca-key-pair
---
apiVersion: v1
kind: Service
metadata:
  name: ca-publisher
  namespace: cert-manager
spec:
  selector:
    app: ca-publisher
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-publisher-tls
  namespace: cert-manager
spec:
  secretName: ca-publisher-tls
  issuerRef:
    name: home-lan-ca
    kind: ClusterIssuer
  dnsNames:
    - pki.home.lan
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ca-publisher
  namespace: cert-manager
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: ca-publisher-tls
      hosts:
        - pki.home.lan
  rules:
    - host: pki.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ca-publisher
                port:
                  number: 80
