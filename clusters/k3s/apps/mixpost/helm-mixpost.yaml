apiVersion: v1
kind: Namespace
metadata:
  name: mixpost
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mixpost
  namespace: mixpost
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: "3.5.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: mixpost
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: inovector/mixpost
              tag: "v2.6.0"
              pullPolicy: IfNotPresent
            env:
              APP_ENV: production
              APP_URL: https://mixpost.home.lan
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        hosts:
          - host: mixpost.home.lan
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - mixpost.home.lan
            secretName: mixpost-tls
    persistence:
      storage:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /var/www/html/storage