apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
  namespace: vaultwarden
spec:
  secretName: vaultwarden-tls
  issuerRef:
    name: home-lan-ca
    kind: ClusterIssuer
  dnsNames:
    - vaultwarden.home.lan
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-grandlan-dev-tls
  namespace: vaultwarden
spec:
  secretName: vaultwarden-grandlan-dev-tls
  issuerRef:
    name: letsencrypt-prod-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - vaultwarden.grandlan.dev
