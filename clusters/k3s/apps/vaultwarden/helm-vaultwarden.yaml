apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 10m
  chart:
    spec:
      chart: vaultwarden
      version: "1.4.2"
      sourceRef:
        kind: HelmRepository
        name: gissilabs
        namespace: vaultwarden
  values:
    service:
      type: ClusterIP

    ingress:
      enabled: true
      className: traefik
      host: vaultwarden.home.lan
      tls:
        - secretName: vaultwarden-tls
          hosts:
            - vaultwarden.home.lan

    persistence:
      enabled: true
      size: 5Gi

    vaultwarden:
      domain: "https://vaultwarden.home.lan"
      allowSignups: true
