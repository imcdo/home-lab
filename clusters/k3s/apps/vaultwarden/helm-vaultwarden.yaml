apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 10m
  chart:
    spec:
      chart: vaultwarden
      version: "1.4.2"
      sourceRef:
        kind: HelmRepository
        name: gissilabs
        namespace: vaultwarden
  values:
    service:
      type: LoadBalancer
      labels:
        external-connection: "true"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "vaultwarden.home.lan"

    persistence:
      enabled: true
      size: 5Gi

    vaultwarden:
      domain: "https://vaultwarden.home.lan"
      allowSignups: false
