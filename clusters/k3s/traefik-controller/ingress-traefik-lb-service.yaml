apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-external
  namespace: ingress-nginx
  labels:
    external-connection: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: firefly.home.lan,vaultwarden.home.lan,vaultwarden.zt,pki.home.lan,zt-gateway.home.lan,gateway.zt
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-ingress-nginx
  ports:
    - name: http
      port: 80
      targetPort: web
    - name: https
      port: 443
      targetPort: websecure